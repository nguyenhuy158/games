# Cấu hình chỉ để chạy thử game Nokia ở máy: npx wrangler dev -c wrangler.nokia.toml --port 8788 --persist-to .wrangler/nokia-state
name = "nokia-dev"
main = "worker/nokia-dev.js"
compatibility_date = "2026-07-03"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "NOKIA"
class_name = "NokiaRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NokiaRoom"]
