<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/nozoom.js"></script>
  <script src="/bfcache.js"></script>
  <meta name="theme-color" content="#1a1008">
  <title data-en="Gold Miner">Đào Vàng</title>
  <link rel="icon" href="/logos/dao-vang.svg" type="image/svg+xml">
  <link rel="icon" href="/logos/dao-vang-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/logos/dao-vang-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="preload" href="assets/atlas.webp" as="fetch" crossorigin>
  <link rel="preload" href="assets/atlas.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/bg1.jpg" as="image">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../panel.css">
</head>
<body>
  <header id="hud" hidden>
    <a href="/" class="btn" title="Các game khác" data-en-title="Other games"><i data-icon="arrow-left"></i></a>
    <span class="stat"><small data-en="Money">Tiền</small> <b id="hMoney">$0</b></span>
    <span class="stat" id="hTargetBox"><small data-en="Target">Mục tiêu</small><small class="short">/</small> <b id="hTarget">$650</b></span>
    <span class="stat"><small data-en="Level">Màn</small><small class="short" data-en="L">M</small> <b id="hLevel">1</b></span>
    <span class="stat"><small data-en="Time">Giờ</small><small class="short"><i data-icon="timer"></i></small> <b id="hTime">60</b></span>
    <button id="btnDyn" title="Thuốc nổ (↑)" data-en-title="Dynamite (↑)"><i data-icon="bomb"></i> <span id="dynCount">0</span></button>
    <button id="btnPanel" title="Ẩn màn hình người chơi khác" data-en-title="Hide other players' screens" hidden><i data-icon="users"></i></button>
    <button id="btnMenu" title="Tạm dừng" data-en-title="Pause"><i data-icon="pause"></i></button>
    <button id="btnSound" title="Âm thanh" data-en-title="Sound"></button>
  </header>
  <ul id="scores" hidden></ul>
  <div class="arena">
    <aside id="panel"></aside>
    <main id="stage">
      <canvas id="game"></canvas>
      <div id="loading" role="status">
        <p data-en="Loading the mine...">Đang tải mỏ vàng...</p>
        <div class="bar"><i id="loadBar"></i></div>
      </div>
      <div id="overlay" hidden></div>
    </main>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
