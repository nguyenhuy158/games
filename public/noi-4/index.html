<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/nozoom.js"></script>
  <script src="/bfcache.js"></script>
  <meta name="theme-color" content="#e6eefa">
  <title data-en="Connect 4">Nối 4</title>
  <link rel="icon" href="/logos/noi-4.svg" type="image/svg+xml">
  <link rel="icon" href="/logos/noi-4-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/logos/noi-4-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home">
    <div class="card">
      <span data-lang-toggle style="justify-self: end;"></span>
      <h1><a href="/" class="back" data-en-title="Other games" title="Các game khác"><i data-icon="arrow-left"></i></a> <img class="logo" src="/logos/noi-4.svg" alt=""> <span data-en="Connect 4">Nối 4</span></h1>
      <p class="sub" data-en="Drop pieces into a column — first to connect 4 in a row (horizontal, vertical, diagonal) wins. Play 1v1 with a friend or the bot.">Thả quân vào cột, ai nối được 4 quân liền (ngang, dọc, chéo) trước là thắng. Đấu 1v1 với bạn hoặc với máy.</p>
      <label><span data-en="Your name">Tên của bạn</span> <input id="name" maxlength="20" autocomplete="off"></label>
      <button id="btnCreate" class="primary" data-en="Create room">Tạo phòng mới</button>
      <div class="join">
        <input id="code" maxlength="4" placeholder="MÃ PHÒNG" data-en-placeholder="ROOM CODE" autocomplete="off">
        <button id="btnJoin" data-en="Join room">Vào phòng</button>
      </div>
      <p class="muted" data-en-html="Playing alone: create a room then press Start to play the bot. The first 2 people to join a room hold the pieces, the rest watch.<br>Each move has 30 seconds max. The starting player alternates each round.">Ở một mình: tạo phòng rồi bấm Bắt đầu để đánh với máy. 2 người đầu vào phòng cầm quân, người sau được xem.<br>Mỗi nước tối đa 30 giây. Ván sau đổi người đi trước.</p>
    </div>
  </section>

  <section id="room" hidden>
    <header>
      <button id="btnLeave" data-en-title="Leave room" title="Rời phòng"><i data-icon="arrow-left"></i></button>
      <button id="btnCopy" data-en-title="Invite: QR code / link" title="Mời bạn: mã QR / link"><span class="lbl" data-en="Room ">Phòng </span><b id="roomCode"></b> <i data-icon="qr-code"></i></button>
      <span id="conn" class="dot" data-en-title="Connection" title="Kết nối"></span>
      <span class="grow"></span>
      <button id="btnSound" data-en-title="Sound" title="Âm thanh"></button>
    </header>
    <div id="vs">
      <div class="side" data-seat="1"><span class="pc p1"></span><b></b><span class="sc"></span></div>
      <div id="clock"></div>
      <div class="side" data-seat="2"><span class="sc"></span><b></b><span class="pc p2"></span></div>
    </div>
    <main id="wrap">
      <div id="board"></div>
      <div id="overlay" hidden>
        <div class="card">
          <h2 id="ovTitle"></h2>
          <div id="levelPick" class="seg" data-en-title="Bot difficulty" title="Độ khó của máy"></div>
          <p id="ovText" class="sub"></p>
          <button id="btnStart" class="primary" hidden data-en="Start">Bắt đầu</button>
          <button id="btnPeek" hidden><i data-icon="eye"></i> <span data-en="View board">Xem bàn</span></button>
        </div>
      </div>
      <button id="btnResult" hidden><i data-icon="trophy"></i> <span data-en="Result">Kết quả</span></button>
    </main>
    <footer id="emoBar"></footer>
  </section>

  <script type="module" src="game.js"></script>
</body>
</html>
