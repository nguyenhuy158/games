<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1b2b">
  <title>Pikachu Online</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home">
    <div class="card">
      <h1><i data-icon="zap"></i> Pikachu Online</h1>
      <p class="sub">Nối thú cổ điển, chơi cùng bạn bè — không cần đăng ký.</p>
      <label>Tên của bạn <input id="name" maxlength="20" autocomplete="off"></label>
      <button id="btnCreate" class="primary">Tạo phòng mới</button>
      <div class="join">
        <input id="code" maxlength="4" placeholder="MÃ PHÒNG" autocomplete="off">
        <button id="btnJoin">Vào phòng</button>
      </div>
      <p class="muted">Chơi một mình: tạo phòng rồi bấm Bắt đầu.</p>
    </div>
  </section>

  <section id="room" hidden>
    <header>
      <button id="btnLeave" title="Rời phòng"><i data-icon="arrow-left"></i></button>
      <button id="btnCopy" title="Sao chép link mời"><span class="lbl">Phòng </span><b id="roomCode"></b> <i data-icon="link"></i></button>
      <span id="conn" class="dot" title="Kết nối"></span>
      <span id="modeTag" hidden></span>
      <span id="clock">--:--</span>
      <button id="btnHint" title="Gợi ý"><i data-icon="lightbulb"></i> <span id="hintLeft">3</span></button>
      <button id="btnShuffle" title="Đổi vị trí"><i data-icon="shuffle"></i> <span id="shuffleLeft">5</span></button>
      <button id="btnSound" title="Âm thanh"></button>
    </header>
    <div id="timeTrack"><div id="timebar"></div></div>
    <ul id="players"></ul>
    <main id="boardWrap">
      <div id="board"></div>
      <div id="overlay" hidden>
        <div class="card">
          <h2 id="ovTitle"></h2>
          <div id="modePick" class="seg" hidden>
            <button data-mode="coop"><i data-icon="users"></i> Chơi chung</button>
            <button data-mode="race"><i data-icon="swords"></i> Đua nhau</button>
          </div>
          <div id="sizePick" class="seg seg4" hidden></div>
          <p id="ovText"></p>
          <button id="btnStart" class="primary" hidden>Bắt đầu</button>
        </div>
      </div>
    </main>
  </section>

  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
