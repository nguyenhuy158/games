<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/nozoom.js"></script>
  <script src="/bfcache.js"></script>
  <meta name="theme-color" content="#0b1b2b">
  <title data-en="Open rooms">Phòng đang mở</title>
  <link rel="icon" href="/logos/hub.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="manifest" href="../manifest.webmanifest">
  <style>
    :root { --bg: #0b1b2b; --panel: #13283d; --line: #23405c; --text: #e8f1fa; --muted: #8aa4bd; --accent: #ffd23f; --good: #3ddc84; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px 24px; display: grid; align-content: start; justify-items: center; gap: 16px;
      background: radial-gradient(circle at 50% 0%, #17385a, var(--bg) 70%) fixed; color: var(--text);
      font: 15px/1.4 "Be Vietnam Pro", "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .ic { width: 1.1em; height: 1.1em; vertical-align: -0.18em; }
    .wrap { width: min(760px, 100%); display: grid; gap: 14px; }
    .top { display: flex; align-items: center; gap: 10px; }
    .top h1 { margin: 0; font-size: 24px; flex: 1; display: flex; align-items: center; gap: 8px; }
    a.back, .lang-toggle { color: var(--text); text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; display: inline-flex; }
    .sub { margin: 0; color: var(--muted); }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips button { flex: none; font: inherit; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
    .chips button.on { background: var(--accent); color: #1b1300; border-color: var(--accent); font-weight: 600; }
    h2 { margin: 6px 0 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    h2 small { color: var(--muted); font-weight: 400; }
    .list { display: grid; gap: 8px; }
    .room {
      display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
      background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none;
    }
    .room:hover { border-color: var(--accent); }
    .room img { width: 40px; height: 40px; }
    .room b { display: block; }
    .room span { color: var(--muted); font-size: 13px; }
    .room .go { font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--accent); color: #1b1300; white-space: nowrap; }
    .room.watch .go { background: none; border: 1px solid var(--line); color: var(--text); }
    .full { color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="/" class="back" title="Các game khác" data-en-title="Other games"><i data-icon="arrow-left"></i></a>
      <h1><i data-icon="users"></i> <span data-en="Open rooms">Phòng đang mở</span></h1>
      <span data-lang-toggle></span>
    </div>
    <p class="sub"><span data-en="Public rooms from every game. Hosts can make their room public from its lobby.">Phòng công khai của mọi game. Chủ phòng bật "Công khai" ở sảnh chờ để phòng hiện ở đây.</span></p>
    <div class="chips" id="filter"></div>
    <h2><span class="live"></span> <span data-en="Waiting for players">Đang chờ người</span> <small id="nWait"></small></h2>
    <div class="list" id="waiting"></div>
    <h2><i data-icon="eye"></i> <span data-en="Playing — watch">Đang chơi — vào xem</span> <small id="nPlay"></small></h2>
    <div class="list" id="playing"></div>
  </div>
  <script type="module" src="phong.js"></script>
</body>
</html>
