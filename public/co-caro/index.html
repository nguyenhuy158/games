<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/nozoom.js"></script>
  <script src="/bfcache.js"></script>
  <meta name="theme-color" content="#f3e3c3">
  <title data-en="Gomoku">Cờ caro</title>
  <link rel="icon" href="/logos/co-caro.svg" type="image/svg+xml">
  <link rel="icon" href="/logos/co-caro-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/logos/co-caro-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home">
    <div class="card">
      <div style="display: flex; gap: 8px; align-items: center; justify-self: end;">
        <button type="button" id="btnHelpHome" title="Cách chơi" data-en-title="How to play"><i data-icon="info"></i></button>
        <span data-lang-toggle></span>
      </div>
      <h1><a href="/" class="back" data-en-title="Other games" title="Các game khác"><i data-icon="arrow-left"></i></a> <img class="logo" src="/logos/co-caro.svg" alt=""> <span data-en="Gomoku">Cờ caro</span></h1>
      <p class="sub" data-en="Line up 5 in a row to win — or 3 in Tic-tac-toe 3×3. Play 1v1 with a friend or the bot, no sign-up needed.">Nối 5 quân là thắng — hoặc XO 3×3 nối 3. Đấu 1v1 với bạn hoặc với máy, không cần đăng ký.</p>
      <label><span data-en="Your name">Tên của bạn</span> <input id="name" maxlength="20" autocomplete="off"></label>
      <button id="btnCreate" class="primary" data-en="Create room">Tạo phòng mới</button>
      <div class="join">
        <input id="code" maxlength="4" placeholder="MÃ PHÒNG" data-en-placeholder="ROOM CODE" autocomplete="off">
        <button id="btnJoin" data-en="Join room">Vào phòng</button>
      </div>
      <p class="muted" data-en-html="Playing alone: create a room then press Start to play the bot. The first 2 people to join a room hold the pieces, the rest watch.<br>Each move has 30 seconds max. The starting player alternates each round.">Ở một mình: tạo phòng rồi bấm Bắt đầu để đánh với máy. 2 người đầu vào phòng cầm quân, người sau được xem.<br>Mỗi nước tối đa 30 giây. Ván sau đổi người đi trước.</p>
    </div>
  </section>

  <section id="room" hidden>
    <header>
      <button id="btnLeave" data-en-title="Leave room" title="Rời phòng"><i data-icon="arrow-left"></i></button>
      <button id="btnCopy" data-en-title="Invite: QR code / link" title="Mời bạn: mã QR / link"><span class="lbl" data-en="Room ">Phòng </span><b id="roomCode"></b> <i data-icon="qr-code"></i></button>
      <span id="conn" class="dot" data-en-title="Connection" title="Kết nối"></span>
      <span class="grow"></span>
      <button id="btnSkin" data-en-title="Change piece style (your device only)" title="Đổi kiểu quân (chỉ máy bạn)"><i data-icon="layers"></i></button>
      <button type="button" id="btnHelp" title="Cách chơi" data-en-title="How to play"><i data-icon="info"></i></button>
      <button id="btnSound" data-en-title="Sound" title="Âm thanh"></button>
    </header>
    <div id="vs">
      <div class="side" data-seat="1"><span class="pc x"></span><b></b><span class="sc"></span></div>
      <div id="clock"></div>
      <div class="side" data-seat="2"><span class="sc"></span><b></b><span class="pc o"></span></div>
    </div>
    <main id="wrap">
      <div id="board"></div>
      <div id="overlay" hidden>
        <div class="card">
          <h2 id="ovTitle"></h2>
          <div id="sizePick" class="seg"></div>
          <label id="blockPick" class="check"><input type="checkbox" role="switch" class="switch"> <span data-en="Blocked-ends rule">Luật chặn 2 đầu</span></label>
          <p id="ovText" class="sub"></p>
          <button id="btnStart" class="primary" hidden data-en="Start">Bắt đầu</button>
          <button id="btnPeek" hidden><i data-icon="eye"></i> <span data-en="View board">Xem bàn</span></button>
        </div>
      </div>
      <button id="btnResult" hidden><i data-icon="trophy"></i> <span data-en="Result">Kết quả</span></button>
    </main>
    <footer id="emoBar"></footer>
  </section>

  <script type="module" src="game.js"></script>
</body>
</html>
