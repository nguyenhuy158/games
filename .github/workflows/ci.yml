name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR: bản mới huỷ bản cũ. main: không huỷ để smoke-prod của từng deploy chạy hết.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.5.0
    with:
      run-test: true
      run-e2e: false

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_VIDEO_DIR: e2e-videos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium system dependencies
        run: pnpm exec playwright-core install-deps chromium
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright-core install chromium
      - name: Install video encoder
        run: pnpm exec playwright-core install ffmpeg
      - name: E2E
        run: pnpm e2e
      - name: Upload E2E videos and round evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-${{ github.sha }}
          path: e2e-videos/
          if-no-files-found: error
          retention-days: 14
      - name: Whole-application coverage gate
        run: pnpm test:coverage
      - name: Upload application coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-failure*.png
          if-no-files-found: ignore

  # Sau khi Cloudflare deploy xong commit này (bản trên web mới hơn commit), chạy bot chơi thử mọi game vào web thật.
  smoke-prod:
    if: github.event_name == 'push'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_SMOKE_MODE: full
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Wait for the deploy of this commit
        env:
          COMMIT_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          want=$(date -d "$COMMIT_AT" +%s)
          for i in $(seq 1 90); do
            at=$(curl -fsS https://games.huyab.cfd/api/version | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s).at;console.log(a?Math.floor(Date.parse(a)/1000):0)})" || echo 0)
            # Chờ thêm 30s cho mọi Durable Object chuyển sang bản mới rồi mới chạy.
            if [ "$at" -ge "$want" ]; then echo "deployed at $at (commit $want)"; sleep 30; exit 0; fi
            sleep 10
          done
          echo "deploy not seen after 15 min"; exit 1
      - run: node tests/smoke.mjs https://games.huyab.cfd
      # Smoke chỉ đọc bằng Chromium: trang chủ, mọi trang game, /phong/ render không lỗi JS.
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium system dependencies
        run: pnpm exec playwright-core install-deps chromium
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright-core install chromium
      - run: pnpm e2e:prod
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-prod-failure
          path: e2e-failure*.png
          if-no-files-found: ignore
