name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR: bản mới huỷ bản cũ. main: không huỷ để smoke-prod của từng deploy chạy hết.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome thêm sau khi đã có code: còn lỗi cũ chưa sửa nên chưa chặn merge.
      - name: Lint (Biome)
        run: pnpm check
        continue-on-error: true

      - name: Unit tests
        run: pnpm test

  # Bật wrangler dev local, smoke chỉ đọc bằng Chromium rồi bot chơi thử mọi game (pnpm e2e).
  e2e:
    name: E2E (local wrangler dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # playwright-core không tự tải browser; cài Chromium đúng phiên bản (e2e/chromium.mjs tự tìm).
      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-failure.png
          if-no-files-found: ignore

  # Sau khi Cloudflare deploy xong commit này (bản trên web mới hơn commit), chạy bot chơi thử mọi game vào web thật.
  smoke-prod:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Wait for the deploy of this commit
        env:
          COMMIT_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          want=$(date -d "$COMMIT_AT" +%s)
          for i in $(seq 1 90); do
            at=$(curl -fsS https://games.huyab.click/api/version | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s).at;console.log(a?Math.floor(Date.parse(a)/1000):0)})" || echo 0)
            # Chờ thêm 30s cho mọi Durable Object chuyển sang bản mới rồi mới chạy.
            if [ "$at" -ge "$want" ]; then echo "deployed at $at (commit $want)"; sleep 30; exit 0; fi
            sleep 10
          done
          echo "deploy not seen after 15 min"; exit 1
      - run: node scripts/smoke.mjs https://games.huyab.click
      # Smoke chỉ đọc bằng Chromium: trang chủ, mọi trang game, /phong/ render không lỗi JS.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm e2e:prod
