name = "pikachu-online"
main = "worker/index.js"
compatibility_date = "2026-07-03"
# Chi vao qua custom domain, giong chia-keo.
workers_dev = false
# games.huyab.click la domain chinh; pikachu.huyab.click (cu) chi con 301 sang domain moi.
routes = [
  { pattern = "games.huyab.click", custom_domain = true },
  { pattern = "pikachu.huyab.click", custom_domain = true },
]

# public/ la file tinh. Worker chay truoc (de 301 domain cu), roi tra file qua ASSETS.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Thông tin bản đang chạy (id, thời điểm tạo) cho /api/version — CI chờ bản mới rồi mới chạy smoke trên web thật.
[version_metadata]
binding = "CF_VERSION"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "TOP"
class_name = "Top"

[[durable_objects.bindings]]
name = "MINER"
class_name = "MinerRoom"

[[durable_objects.bindings]]
name = "MINES"
class_name = "MineRoom"

[[durable_objects.bindings]]
name = "DICE"
class_name = "DiceRoom"

[[durable_objects.bindings]]
name = "CARO"
class_name = "CaroRoom"

[[durable_objects.bindings]]
name = "SHIPS"
class_name = "ShipRoom"

[[durable_objects.bindings]]
name = "NOKIA"
class_name = "NokiaRoom"

# SQLite-backed DO: dung duoc o goi free.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Bang xep hang (DO SQLite thay cho D1 vi goi free da het quota D1).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Top"]

# Phong Dao Vang nhieu nguoi.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["MinerRoom"]

# Phong Do min nhieu nguoi.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["MineRoom"]

# Phong Bau cua.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["DiceRoom"]

# Phong Co caro (Noi 4 dung chung class nay).
[[migrations]]
tag = "v6"
new_sqlite_classes = ["CaroRoom"]

# Phong Ban tau.
[[migrations]]
tag = "v7"
new_sqlite_classes = ["ShipRoom"]

# Cac game Nokia (Snake, Bantumi, Pairs, Logic...): mot class, moi phong 1 DO "<game>:<CODE>".
[[migrations]]
tag = "v8"
new_sqlite_classes = ["NokiaRoom"]

[observability]
enabled = true
