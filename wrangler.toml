name = "pikachu-online"
main = "worker/index.js"
compatibility_date = "2026-07-03"
# Chi vao qua custom domain, giong chia-keo.
workers_dev = false
routes = [{ pattern = "pikachu.huyab.click", custom_domain = true }]

# public/ la file tinh; Worker chi chay cho /api/* (WebSocket phong choi).
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "TOP"
class_name = "Top"

# SQLite-backed DO: dung duoc o goi free.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Bang xep hang (DO SQLite thay cho D1 vi goi free da het quota D1).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Top"]

[observability]
enabled = true
